[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-skill-eval"
version = "2.1.0"
description = "Regression gate for agent skills and prompt versions: deterministic checks + rubric judge, A/B between two skill versions, CI verdicts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["llm", "agent", "skills", "evaluation", "regression-testing", "evals"]
dependencies = ["pyyaml>=6", "jsonschema>=4.18,<5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
skilleval = "skilleval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
